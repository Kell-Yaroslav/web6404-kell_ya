<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TradeDiary — Авторизация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <img src="images/logo.png" alt="Логотип TradeDiary" width="50" height="50">
                <span class="header__title">TradeDiary</span>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav__link">Календарь</a>
                <a href="trades.html" class="nav__link">Сделки</a>
                <a href="news.html" class="nav__link">Новости</a>
                <a href="about.html" class="nav__link">О проекте</a>
                <a href="login.html" class="nav__link nav__link--active">Вход</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="auth-form">
            <h2 class="auth-form__title">Вход в систему</h2>
            <form class="form" id="loginForm">
                <!-- Поле 1: текст (логин) -->
                <div class="form__group">
                    <label class="form__label" for="username">Логин</label>
                    <input class="form__input" type="text" id="username" name="username" required placeholder="Введите логин">
                </div>

                <!-- Поле 2: пароль -->
                <div class="form__group">
                    <label class="form__label" for="password">Пароль</label>
                    <input class="form__input" type="password" id="password" name="password" required placeholder="Введите пароль">
                </div>

                <!-- Поле 3: чекбокс (согласие) -->
                <div class="form__group form__group--checkbox">
                    <input class="form__checkbox" type="checkbox" id="consent" name="consent" required>
                    <label class="form__label form__label--inline" for="consent">Согласен на обработку персональных данных</label>
                </div>

                <button class="button button--submit" type="submit">Войти</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2026 TradeDiary · Келль Я.А. · группа 6404</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
